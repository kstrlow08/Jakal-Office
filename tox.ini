[tox]
env_list = py311, py312, py313, py314, pkg
skip_missing_interpreters = true

[testenv]
description = Run Office integration tests (build web assets first)
extras = web, web-test
commands = python -m pytest web_tests -q {posargs}

[testenv:pkg]
description = Build the Office distribution and validate metadata
extras = release
commands =
    python -m build
    python -m twine check dist/*.whl dist/*.tar.gz
