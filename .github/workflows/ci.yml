name: Office package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build Office distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel with the external document module
        run: |
          python -m venv build/smoke-wheel
          build/smoke-wheel/bin/python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist').glob('jakal_office-*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[web]'])"
          build/smoke-wheel/bin/python -I scripts/check_installed_package.py
      - name: Verify source distribution
        run: |
          python -m venv build/smoke-sdist
          build/smoke-sdist/bin/python -c "from pathlib import Path; import subprocess, sys; sdist, = Path('dist').glob('jakal_office-*.tar.gz'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(sdist) + '[web]'])"
          build/smoke-sdist/bin/python -I scripts/check_installed_package.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: jakal-office-python-distributions
          path: dist/
          if-no-files-found: error
