[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jakal-office"
version = "1.0"

description = "Jakal Office document workspace powered by jakal-hwpx"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = ["jakal-hwpx==1.0", "lxml>=5.0.0,<7"]
keywords = ["office", "hwpx", "hwp", "document", "editor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Editors :: Word Processors",
]

[project.urls]
Homepage = "https://github.com/kstrlow08/Jakal-Office"
Source = "https://github.com/kstrlow08/Jakal-Office"
Issues = "https://github.com/kstrlow08/Jakal-Office/issues"
Documentation = "https://github.com/kstrlow08/Jakal-Office#readme"
Releases = "https://github.com/kstrlow08/Jakal-Office/releases"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.18,<2",
  "pytest>=8.0",
  "ruff>=0.14,<0.15",
  "setuptools>=77",
  "tox>=4.0",
  "twine>=5.0",
]
lint = ["mypy>=1.18,<2", "ruff>=0.14,<0.15"]
release = ["build>=1.2", "pytest>=8.0", "setuptools>=77", "twine>=5.0"]
test = ["pytest>=8.0"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "psutil>=5.9,<8", "Pillow>=13.0,<14", "pypdfium2>=5.14,<6", "mcp>=2.3,<3"]
web-test = ["httpx>=0.27,<1", "pytest>=8.0"]

[tool.setuptools]
packages = ["server"]
include-package-data = true

[tool.setuptools.package-data]
server = ["*.mjs"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["web_tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
